<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">

          content="width=device-width,
                   initial-scale=1.0,

                   user-scalable=no,
                   viewport-fit=cover">

    <title>حاسبة تحويل العملات والمصاريف</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap"
          rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        tajawal: ['Tajawal', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>

        /* =========================
           BASE
        ========================= */

        * {
            box-sizing: border-box;
        }

        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            width: 100%;
            min-height: 100%;
            margin: 0;

            font-family: 'Tajawal', sans-serif;

            background:
                radial-gradient(
                    circle at top right,
                    rgba(37, 99, 235, 0.18),
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom left,
                    rgba(124, 58, 237, 0.18),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #0f172a 0%,
                    #1e1b4b 50%,
                    #0f172a 100%
                );

            overflow: hidden;

            touch-action: manipulation;

            /* مهم للموبايل */
            min-height: 100svh;
        }


        /* =========================
           MAIN LAYOUT
        ========================= */

        .page-wrapper {
            width: 100%;

            min-height: 100svh;
            min-height: 100dvh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding:
                max(12px, env(safe-area-inset-top))
                12px
                max(12px, env(safe-area-inset-bottom));

            overflow: hidden;
        }


        .main-container {
            width: 100%;
            max-width: 460px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin: auto;
        }


        /* =========================
           CARD
        ========================= */

        .glass-card {
            width: 100%;

            background: rgba(30, 41, 59, 0.78);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            border: 1px solid rgba(255, 255, 255, 0.12);

            border-radius: 28px;

            padding: 18px;

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);

            /* لا نخلي الكرت يأخذ 100% من ارتفاع الشاشة */
            height: auto;

            max-height: calc(100svh - 24px);
            max-height: calc(100dvh - 24px);

            overflow-y: auto;
            overflow-x: hidden;

            scrollbar-width: none;

            display: flex;
            flex-direction: column;
        }

        .glass-card::-webkit-scrollbar {
            display: none;
        }


        /* =========================
           INPUT
        ========================= */

        .glass-input {
            background: rgba(15, 23, 42, 0.65);

            border: 1px solid rgba(255, 255, 255, 0.15);

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        .glass-input:focus-within {
            border-color: #38bdf8;

            box-shadow:
                0 0 12px rgba(56, 189, 248, 0.3);

            background: rgba(15, 23, 42, 0.9);
        }


        /* =========================
           MOBILE INPUT FIX
        ========================= */

        input {
            -webkit-tap-highlight-color: transparent;
        }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type="number"] {
            -moz-appearance: textfield;
        }


        /* =========================
           VERY SMALL PHONES
        ========================= */

        @media (max-height: 700px) {

            .page-wrapper {
                align-items: flex-start;

                padding-top: 10px;
                padding-bottom: 10px;

                overflow-y: auto;
            }

            .glass-card {
                padding: 14px;
                border-radius: 24px;

                max-height: calc(100svh - 20px);
                max-height: calc(100dvh - 20px);
            }
        }


        /* =========================
           NORMAL PHONE
        ========================= */

        @media (max-width: 480px) {

            .page-wrapper {
                padding-left: 10px;
                padding-right: 10px;
            }

            .glass-card {
                padding: 15px;
            }

            .main-container {
                max-width: 430px;
            }
        }


        /* =========================
           KEYBOARD OPEN
        ========================= */

        @media (max-height: 500px) {

            .page-wrapper {
                align-items: flex-start;
                padding-top: 8px;
            }

            .glass-card {
                max-height: calc(100dvh - 16px);
            }
        }

    </style>
</head>


<body class="text-slate-100 select-none">

    <div class="page-wrapper">

        <main class="main-container">

            <div class="glass-card">


                <!-- =========================
                     INPUTS
                ========================= -->

                <div class="space-y-3">


                    <!-- Input 1 -->

                    <div class="space-y-1">

                        <label

                                <i class="fa-solid fa-coins text-sm"></i>

                                الخانة الأولى: سعر العملة

                            </span>

                            <span
                                class="text-[10px] text-slate-400 bg-slate-800 px-2 py-0.5 rounded-full">

                                (الأصل)

                            </span>

                        </label>


                        <div
                            class="glass-input rounded-2xl flex items-center px-4 py-2 border border-sky-500/40">

                            <input
                                type="number"
                                id="currencyPrice"
                                placeholder="0.00"
                                step="any"
                                inputmode="decimal"
                                pattern="[0-9]*"

                                class="w-full bg-transparent text-2xl sm:text-3xl font-black text-white focus:outline-none tracking-wide text-right dir-ltr placeholder:text-slate-600"

                                oninput="calculateResult()">

                            <span
                                class="text-xs font-black text-sky-400 mr-2 bg-sky-950/80 border border-sky-800 px-2.5 py-1 rounded-xl">

                                عملة

                            </span>

                        </div>

                    </div>


                    <!-- Input 2 -->

                    <div class="space-y-1">

                        <label
                            for="addedExpensesPercent"
                            class="block text-[11px] font-semibold text-slate-300 flex items-center justify-between">

                            <span>

                                <i class="fa-solid fa-percent text-emerald-400 ml-1.5"></i>

                                الخانة الثانية: المصاريف المضافة

                            </span>

                            <span class="text-[10px] text-slate-400">

                                (%)

                            </span>

                        </label>


                        <div
                            class="glass-input rounded-xl flex items-center px-3 py-1.5 border">

                            <input
                                type="number"
                                id="addedExpensesPercent"
                                placeholder="0"
                                step="any"
                                inputmode="decimal"
                                pattern="[0-9]*"

                                class="w-full bg-transparent text-base font-bold text-white focus:outline-none tracking-wide text-right dir-ltr placeholder:text-slate-600"

                                oninput="calculateResult()">

                            <span
                                class="text-[10px] font-bold text-slate-400 mr-2 bg-slate-800 px-2 py-0.5 rounded-lg">

                                %

                            </span>

                        </div>

                    </div>


                    <!-- Input 3 -->

                    <div class="space-y-1">

                        <label
                            for="exchangeToUsd"
                            class="block text-[11px] font-semibold text-slate-300 flex items-center justify-between">

                            <span>

                                <i class="fa-solid fa-dollar-sign text-amber-400 ml-1.5"></i>

                                الخانة الثالثة: تصريف العملة للدولار

                            </span>

                            <span class="text-[10px] text-slate-400">

                                (تقسيم)

                            </span>

                        </label>


                        <div

                                type="number"

                                oninput="calculateResult()">

                            <span
                                class="text-[10px] font-bold text-slate-400 mr-2 bg-slate-800 px-2 py-0.5 rounded-lg">

                                USD

                            </span>

                        </div>

                    </div>


                    <!-- Input 4 -->

                    <div class="space-y-1">

                        <label
                            for="exchangeUsdToIqd"

                            <span>

                                <i class="fa-solid fa-money-bill-wave text-purple-400 ml-1.5"></i>

                            <span class="text-[10px] text-slate-400">

                                type="number"

                                id="step3Val"

                                0 د.ع

    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>

        function calculateResult() {

            const price =
                parseFloat(
                    document.getElementById('currencyPrice').value
                ) || 0;

            const percent =
                parseFloat(
                    document.getElementById('addedExpensesPercent').value
                ) || 0;

            const toUsd =
                parseFloat(
                    document.getElementById('exchangeToUsd').value
                ) || 0;

            const usdToIqd =
                parseFloat(
                    document.getElementById('exchangeUsdToIqd').value
                ) || 0;


            const finalResultEl =
                document.getElementById('finalResult');

            const step1El =
                document.getElementById('step1Val');

            const step2El =
                document.getElementById('step2Val');

            const step3El =
                document.getElementById('step3Val');


            if (price <= 0) {

                finalResultEl.innerHTML =
                    `0 <span class="text-base font-bold text-slate-400">د.ع</span>`;

                step1El.textContent = '0';
                step2El.textContent = '$0';
                step3El.textContent = '0 د.ع';

                return;
            }


            // Step 1

            const addedExpense =
                price * (percent / 100);

            const totalCurrencyWithExpense =
                price + addedExpense;


            // Step 2

            let priceInUSD = 0;

            if (toUsd > 0) {

                priceInUSD =
                    totalCurrencyWithExpense / toUsd;

            }


            // Step 3

            const finalResultInDinar =
                priceInUSD * usdToIqd;


            // Formatting

            const formattedTotalCurrency =
                formatNumber(totalCurrencyWithExpense, 2);

            const formattedUSD =
                formatNumber(priceInUSD, 2);

            const formattedFinal =
                formatNumber(finalResultInDinar, 0);


            // Breakdown

            step1El.textContent =
                formattedTotalCurrency;

            step2El.textContent =
                `$${formattedUSD}`;

            step3El.textContent =
                `${formattedFinal} د.ع`;


            // Final result

            finalResultEl.innerHTML =
                `${formattedFinal}
                 <span class="text-base font-bold text-emerald-400">
                    د.ع
                 </span>`;
        }


        function formatNumber(num, decimals = 2) {

            if (isNaN(num))
                return '0';

            return num.toLocaleString('en-US', {

                minimumFractionDigits: 0,

                maximumFractionDigits: decimals

            });
        }


        function resetCurrencyOnly() {

            const currencyInput =
                document.getElementById('currencyPrice');

            currencyInput.value = '';

            calculateResult();

            /* نخلي التركيز بدون ما نخلي الصفحة تقفز */

            requestAnimationFrame(() => {

                currencyInput.focus({
                    preventScroll: true
                });

            });


            const card =
                document.querySelector('.glass-card');

            card.classList.add('scale-[0.99]');

            setTimeout(() => {

                card.classList.remove('scale-[0.99]');

            }, 120);
        }


        /* =========================
           AUTO MOVE TO NEXT INPUT
           ========================= */

       const inputs = [
    document.getElementById('currencyPrice'),
    document.getElementById('addedExpensesPercent'),
    document.getElementById('exchangeToUsd'),
    document.getElementById('exchangeUsdToIqd')
];

inputs.forEach((input, index) => {

    input.addEventListener('keydown', function (event) {

        if (event.key === 'Enter') {

            event.preventDefault();

            if (index < inputs.length - 1) {
                inputs[index + 1].focus();
            } else {
                this.blur();
            }

        }

    });

});

    </script>

</body>
</html>
